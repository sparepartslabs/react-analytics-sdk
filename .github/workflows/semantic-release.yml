name: Semantic release
on:
  push:
    branches: [main]
concurrency:
  group: semantic-release
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Commitizen
        run: pip install "commitizen>=4,<5"
      - name: Create the next semantic version tag
        id: version
        shell: bash
        run: |
          set +e
          OUTPUT=$(cz bump --get-next 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 3 ] || [ "$STATUS" -eq 21 ]; then
            echo "No release-worthy conventional commits since the last tag."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            printf '%s\n' "$OUTPUT"
            exit "$STATUS"
          fi
          NEXT_VERSION=$(printf '%s\n' "$OUTPUT" | tail -n 1)
          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Commitizen returned an invalid version: $NEXT_VERSION"
            exit 1
          fi
          TAG="v${NEXT_VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Dispatch npm publisher
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --ref main -f tag="$TAG"
